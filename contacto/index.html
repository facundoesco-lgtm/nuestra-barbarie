<!DOCTYPE html><html lang="es"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contacto — Somos la barbarie</title><meta name="description" content="Una investigación que se volvió ecosistema."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,72,400;0,72,500;1,72,400;1,72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/nuestra-barbarie/_astro/_slug_.B6qnI_0d.css">

</style></head> <body> <header class="site-header"> <div class="wrap"> <div class="brand-block"> <a class="brand" href="/nuestra-barbarie/">Somos la barbarie</a> <span class="tagline">Una tesis, muchos caminos para recorrerla</span> </div> <nav class="main-nav" aria-label="Navegación principal"> <a href="/nuestra-barbarie/bitacora/">Bitácora</a><a href="/nuestra-barbarie/diccionario/">Diccionario</a><a href="/nuestra-barbarie/recursos/">Recursos</a><a href="/nuestra-barbarie/contacto/" aria-current="page">Contacto</a> <a class="nav-primario" href="/nuestra-barbarie/proyecto/">El proyecto →</a> </nav> </div> </header> <main>  <section class="wrap contacto-section" data-astro-cid-2mxdoeuz> <p class="ficha" data-astro-cid-2mxdoeuz>Contacto</p> <h1 data-astro-cid-2mxdoeuz>Escribinos</h1> <p class="contacto-intro" data-astro-cid-2mxdoeuz>¿Preguntas, correcciones, pedidos, propuestas de colaboración? Este formulario llega directo a la casilla del proyecto.</p> <form id="form-contacto" class="contacto-form" data-astro-cid-2mxdoeuz> <div class="campo" data-astro-cid-2mxdoeuz> <label for="nombre" data-astro-cid-2mxdoeuz>Nombre</label> <input type="text" id="nombre" name="nombre" required data-astro-cid-2mxdoeuz> </div> <div class="campo" data-astro-cid-2mxdoeuz> <label for="email" data-astro-cid-2mxdoeuz>Email</label> <input type="email" id="email" name="email" required data-astro-cid-2mxdoeuz> </div> <div class="campo" data-astro-cid-2mxdoeuz> <label for="mensaje" data-astro-cid-2mxdoeuz>Mensaje</label> <textarea id="mensaje" name="mensaje" rows="6" required data-astro-cid-2mxdoeuz></textarea> </div> <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" data-astro-cid-2mxdoeuz> <button type="submit" class="btn" data-astro-cid-2mxdoeuz>Enviar</button> <p id="contacto-estado" class="contacto-estado" role="status" data-astro-cid-2mxdoeuz></p> </form> </section>  </main> <footer class="site-footer"> <div class="wrap footer-flex"> <img src="/nuestra-barbarie/imagenes/mallea-cabeza-penaloza-transparente.png" alt="Ilustración de Cristian Mallea" class="footer-logo"> <div class="footer-contacto"> <a href="/nuestra-barbarie/contacto/" class="footer-contacto-link">Contacto →</a> <a href="mailto:somoslabarbarie@gmail.com" class="footer-mail">somoslabarbarie@gmail.com</a> </div> </div> </footer></body></html>  <script type="module">
  const form = document.getElementById('form-contacto');
  const estado = document.getElementById('contacto-estado');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    estado.textContent = 'Enviando…';
    estado.className = 'contacto-estado';
    try {
      const res = await fetch('https://formspree.io/f/xoeaprza', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form),
      });
      if (res.ok) {
        form.reset();
        estado.textContent = 'Gracias, tu mensaje fue enviado.';
        estado.classList.add('ok');
      } else {
        throw new Error();
      }
    } catch {
      estado.textContent = 'Hubo un error. Probá de nuevo o escribí directo a somoslabarbarie@gmail.com.';
      estado.classList.add('error');
    } finally {
      btn.disabled = false;
    }
  });
</script>
